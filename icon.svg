<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Pozadi -->
  <rect width="128" height="128" rx="20" fill="#2C3E50"/>
  
  <!-- Kruh s hrebicky -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#ECF0F1" stroke-width="3"/>
  
  <!-- Hrebicky po kruhu -->
  <g fill="#E74C3C">
    <circle cx="64" cy="16" r="2.5"/>
    <circle cx="94" cy="26" r="2.5"/>
    <circle cx="112" cy="64" r="2.5"/>
    <circle cx="94" cy="102" r="2.5"/>
    <circle cx="64" cy="112" r="2.5"/>
    <circle cx="34" cy="102" r="2.5"/>
    <circle cx="16" cy="64" r="2.5"/>
    <circle cx="34" cy="26" r="2.5"/>
  </g>
  
  <!-- String art vzor - krizove vlakna -->
  <g stroke="#3498DB" stroke-width="0.8" opacity="0.8">
    <line x1="64" y1="16" x2="94" y2="102"/>
    <line x1="94" y1="26" x2="34" y2="102"/>
    <line x1="112" y1="64" x2="16" y2="64"/>
    <line x1="94" y1="102" x2="34" y2="26"/>
    <line x1="64" y1="112" x2="64" y2="16"/>
    <line x1="34" y1="102" x2="94" y2="26"/>
    <line x1="16" y1="64" x2="112" y2="64"/>
    <line x1="34" y1="26" x2="94" y2="102"/>
  </g>
  
  <!-- Vice vlaken pro efekt -->
  <g stroke="#3498DB" stroke-width="0.6" opacity="0.6">
    <line x1="64" y1="16" x2="112" y2="64"/>
    <line x1="94" y1="26" x2="64" y2="112"/>
    <line x1="112" y1="64" x2="34" y2="26"/>
    <line x1="94" y1="102" x2="16" y2="64"/>
  </g>
  
  <!-- Text "SA" -->
  <text x="64" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="#ECF0F1" text-anchor="middle">SA</text>
</svg>
